name: sharding-repl-cache

services:
  configSrv-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSrv --port 27019 --bind_ip_all
    volumes: [configSrv_1_data:/data/db]

  configSrv-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSrv --port 27019 --bind_ip_all
    volumes: [configSrv_2_data:/data/db]

  configSrv-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSrv --port 27019 --bind_ip_all
    volumes: [configSrv_3_data:/data/db]

  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27018 --bind_ip_all
    volumes: [shard1_1_data:/data/db]

  shard1-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27018 --bind_ip_all
    volumes: [shard1_2_data:/data/db]

  shard1-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27018 --bind_ip_all
    volumes: [shard1_3_data:/data/db]

  shard2-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27018 --bind_ip_all
    volumes: [shard2_1_data:/data/db]

  shard2-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27018 --bind_ip_all
    volumes: [shard2_2_data:/data/db]

  shard2-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27018 --bind_ip_all
    volumes: [shard2_3_data:/data/db]

  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb configSrv/configSrv-1:27019,configSrv-2:27019,configSrv-3:27019 --port 27017 --bind_ip_all
    restart: unless-stopped
    depends_on: [configSrv-1, configSrv-2, configSrv-3, shard1-1, shard1-2, shard1-3, shard2-1, shard2-2, shard2-3]

  redis:
    image: dh-mirror.gitverse.ru/redis:7-alpine

  pymongo_api:
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on: [mongos, redis]
    ports: ["8080:8080"]
    environment:
      MONGODB_URL: mongodb://mongos:27017
      MONGODB_DATABASE_NAME: somedb
      REDIS_URL: redis://redis:6379

volumes:
  configSrv_1_data:
  configSrv_2_data:
  configSrv_3_data:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
